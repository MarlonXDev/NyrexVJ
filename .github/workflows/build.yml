name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/NyrexVJ | Out-Null
          Copy-Item build/Release/NyrexVJ.exe dist/NyrexVJ/
          Copy-Item LICENSE dist/NyrexVJ/
          Copy-Item README.md dist/NyrexVJ/
          Compress-Archive -Path dist/NyrexVJ -DestinationPath dist/NyrexVJ-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NyrexVJ-windows-x64
          path: dist/NyrexVJ-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NyrexVJ-windows-x64.zip
