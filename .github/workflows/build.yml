name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(NyrexVJ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $($env:GITHUB_REF_NAME) does not match CMakeLists.txt version v$version"
            exit 1
          }

      - name: Configure
        shell: pwsh
        run: |
          $release = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'ON' } else { 'OFF' }
          cmake -S . -B build -A x64 -DNYREXVJ_RELEASE=$release -DNYREXVJ_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/NyrexVJ | Out-Null
          Copy-Item build/Release/NyrexVJ.exe dist/NyrexVJ.exe
          Copy-Item build/Release/NyrexVJ.exe dist/NyrexVJ/
          Copy-Item LICENSE dist/NyrexVJ/
          Copy-Item README.md dist/NyrexVJ/
          Copy-Item CHANGELOG.md dist/NyrexVJ/
          Compress-Archive -Path dist/NyrexVJ -DestinationPath dist/NyrexVJ-windows-x64.zip
          $hash = (Get-FileHash dist/NyrexVJ.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NyrexVJ.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: NyrexVJ-windows-x64
          path: |
            dist/NyrexVJ-windows-x64.zip
            dist/NyrexVJ.exe
            dist/SHA256SUMS.txt

      - name: Publish nightly
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $title = "Nightly build ${{ github.run_number }} ($short)"
          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete nightly --cleanup-tag --yes
          }
          $notes = "Automatic build of the latest commit on main.`n`nCommit: ${{ github.sha }}"
          gh release create nightly dist/NyrexVJ.exe dist/SHA256SUMS.txt dist/NyrexVJ-windows-x64.zip --prerelease --target ${{ github.sha }} --title $title --notes $notes
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[?" + [regex]::Escape($version) + "\]?[^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($text, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "NyrexVJ $version" }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
          }
          gh release create $tag dist/NyrexVJ.exe dist/SHA256SUMS.txt dist/NyrexVJ-windows-x64.zip --verify-tag --title "NyrexVJ $version" --notes-file release_notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
