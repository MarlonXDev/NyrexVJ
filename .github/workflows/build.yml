name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(NyrexVJ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $($env:GITHUB_REF_NAME) does not match CMakeLists.txt version v$version"
            exit 1
          }

      - name: Check translations
        shell: pwsh
        run: python scripts/check_i18n.py

      - name: Check the test matrix, the website and the measuring script
        shell: pwsh
        run: |
          python scripts/check_test_matrix.py
          python scripts/build_manual_site.py --check
          python scripts/test_measure_live.py
          python scripts/check_release.py
          python scripts/test_release_gate.py
          python scripts/test_check_release.py

      - name: Get the FFmpeg headers and libraries
        shell: pwsh
        continue-on-error: true
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-sdk
          $root = (Get-ChildItem ffmpeg-sdk -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$root/include/libavcodec/avcodec.h")) {
            Write-Error "The FFmpeg archive has no headers"
            exit 1
          }
          Get-ChildItem "$root/bin" -Filter *.dll | ForEach-Object { Write-Host $_.Name }
          "FFMPEG_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          $release = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'ON' } else { 'OFF' }
          $arguments = @('-S', '.', '-B', 'build', '-A', 'x64', "-DNYREXVJ_RELEASE=$release", "-DNYREXVJ_BUILD_NUMBER=${{ github.run_number }}")
          if ($env:FFMPEG_SDK) {
            $arguments += "-DNYREXVJ_FFMPEG_ROOT=$($env:FFMPEG_SDK)"
          }
          cmake @arguments

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          if ($env:FFMPEG_SDK) {
            New-Item -ItemType Directory -Path build/Release/ffmpeg -Force | Out-Null
            Copy-Item "$($env:FFMPEG_SDK)/bin/*.dll" build/Release/ffmpeg/
            $env:NYREXVJ_REQUIRE_VIDEO = '1'
          }
          ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/NyrexVJ | Out-Null
          Copy-Item build/Release/NyrexVJ.exe dist/NyrexVJ.exe
          Copy-Item build/Release/NyrexVJ.exe dist/NyrexVJ/
          Copy-Item LICENSE dist/NyrexVJ/
          Copy-Item README.md dist/NyrexVJ/
          Copy-Item CHANGELOG.md dist/NyrexVJ/
          Copy-Item CHANGELOG.de.md dist/NyrexVJ/
          Copy-Item README.de.md dist/NyrexVJ/
          Compress-Archive -Path dist/NyrexVJ -DestinationPath dist/NyrexVJ-windows-x64.zip
          $hash = (Get-FileHash dist/NyrexVJ.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NyrexVJ.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: NyrexVJ-windows-x64
          path: |
            dist/NyrexVJ-windows-x64.zip
            dist/NyrexVJ.exe
            dist/SHA256SUMS.txt

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oP 'project\(NyrexVJ VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version v$version"
            exit 1
          fi

      - name: Check translations
        run: python3 scripts/check_i18n.py

      - name: Check the test matrix, the website and the measuring script
        run: |
          python3 scripts/check_test_matrix.py
          python3 scripts/build_manual_site.py --check
          python3 scripts/test_measure_live.py
          python3 scripts/check_release.py
          python3 scripts/test_release_gate.py
          python3 scripts/test_check_release.py

      - name: Install build and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb xauth libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0 binutils gdb valgrind

      - name: Get the FFmpeg headers and libraries
        continue-on-error: true
        run: |
          url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz'
          mkdir -p ffmpeg-sdk
          curl -fsSL "$url" -o ffmpeg.tar.xz
          tar -xJf ffmpeg.tar.xz -C ffmpeg-sdk
          root=$(find ffmpeg-sdk -mindepth 1 -maxdepth 1 -type d | head -1)
          test -f "$root/include/libavcodec/avcodec.h"
          ls "$root/lib" | grep -E '\.so' || true
          echo "FFMPEG_SDK=$PWD/$root" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          release=OFF
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then release=ON; fi
          arguments=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNYREXVJ_RELEASE=$release -DNYREXVJ_BUILD_NUMBER=${{ github.run_number }} -DGLFW_BUILD_WAYLAND=OFF "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          if [ -n "${FFMPEG_SDK:-}" ]; then
            arguments+=("-DNYREXVJ_FFMPEG_ROOT=$FFMPEG_SDK")
          else
            arguments+=(-DNYREXVJ_VIDEO=OFF)
          fi
          cmake "${arguments[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Start the virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2

      - name: Test
        run: |
          if [ -n "${FFMPEG_SDK:-}" ]; then
            mkdir -p build/ffmpeg
            cp -a "$FFMPEG_SDK"/lib/*.so* build/ffmpeg/
            export NYREXVJ_REQUIRE_VIDEO=1
            export LD_LIBRARY_PATH="$PWD/build/ffmpeg"
          fi
          ctest --test-dir build --output-on-failure

      - name: Check the picture conversion for writes past its buffer
        continue-on-error: true
        run: |
          if [ -n "${FFMPEG_SDK:-}" ]; then
            export NYREXVJ_REQUIRE_VIDEO=1
            export LD_LIBRARY_PATH="$PWD/build/ffmpeg"
            valgrind -q --error-exitcode=9 build/nvj_picture_convert_tests
          fi

      - name: Check the shaders and start the program
        run: |
          if [ -n "${FFMPEG_SDK:-}" ]; then
            export LD_LIBRARY_PATH="$PWD/build/ffmpeg"
          fi
          export NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-data"
          build/NyrexVJ --check-shaders
          build/NyrexVJ --live-selftest
          build/NyrexVJ --plugin-selftest build/plugins/nyrexvj-example
          build/NyrexVJ --plugin-selftest build/plugins/nyrexvj-legacy
          NYREXVJ_NDI_LIB="$PWD/build/fake_ndi.so" build/NyrexVJ --output-selftest
          NYREXVJ_REQUIRE_VIDEO="${FFMPEG_SDK:+1}" NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-color" build/NyrexVJ --fresh --no-update-check --no-welcome --color-selftest tests/data --bench-out "$RUNNER_TEMP/color.json"
          test -s "$RUNNER_TEMP/color.json"
          NYREXVJ_REQUIRE_VIDEO="${FFMPEG_SDK:+1}" NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-flow" build/NyrexVJ --fresh --no-update-check --no-welcome --flow-selftest tests/data --bench-out "$RUNNER_TEMP/flow.json"
          test -s "$RUNNER_TEMP/flow.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-person" build/NyrexVJ --fresh --no-update-check --no-welcome --person-selftest --bench-out "$RUNNER_TEMP/person.json"
          test -s "$RUNNER_TEMP/person.json"
          if [ -n "${FFMPEG_SDK:-}" ]; then
            NYREXVJ_REQUIRE_VIDEO=1 python3 -B scripts/test_stream_input.py --binary build/NyrexVJ --ffmpeg "$FFMPEG_SDK/bin/ffmpeg" --out "$RUNNER_TEMP/stream.json"
            test -s "$RUNNER_TEMP/stream.json"
          fi
          if [ -n "${FFMPEG_SDK:-}" ]; then
            NYREXVJ_REQUIRE_VIDEO=1 NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-record" build/NyrexVJ --fresh --no-update-check --no-welcome --record-selftest
          fi
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-api" build/NyrexVJ --fresh --no-update-check --no-welcome --api-selftest
          build/NyrexVJ --shader-selftest
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-generators" build/NyrexVJ --fresh --no-update-check --no-welcome --generator-selftest 5 --bench-out "$RUNNER_TEMP/generators.json"
          test -s "$RUNNER_TEMP/generators.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-gpuparticles" build/NyrexVJ --fresh --no-update-check --no-welcome --gpu-particle-selftest 2 --bench-out "$RUNNER_TEMP/gpuparticles.json"
          test -s "$RUNNER_TEMP/gpuparticles.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-gpudiag" build/NyrexVJ --fresh --no-update-check --no-welcome --gpu-diag-selftest --bench-out "$RUNNER_TEMP/gpudiag.json"
          test -s "$RUNNER_TEMP/gpudiag.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-shaderedit" build/NyrexVJ --fresh --no-update-check --no-welcome --shader-editor-selftest 30 --bench-out "$RUNNER_TEMP/shaderedit.json"
          test -s "$RUNNER_TEMP/shaderedit.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-shaderedit-ui" build/NyrexVJ --fresh --no-update-check --no-welcome --audio-demo --frames 100000 --shader-editor-uitest --bench-out "$RUNNER_TEMP/shaderedit-ui.json"
          test -s "$RUNNER_TEMP/shaderedit-ui.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-interface-ui" build/NyrexVJ --fresh --no-update-check --no-welcome --audio-demo --frames 100000 --interface-uitest --bench-out "$RUNNER_TEMP/interface-ui.json"
          test -s "$RUNNER_TEMP/interface-ui.json"
          python3 scripts/test_interface_recovery.py build/NyrexVJ --output "$RUNNER_TEMP/interface-recovery.json"
          test -s "$RUNNER_TEMP/interface-recovery.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-routing" build/NyrexVJ --fresh --no-update-check --no-welcome --routing-selftest 30 --bench-out "$RUNNER_TEMP/routing.json"
          test -s "$RUNNER_TEMP/routing.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-netsync" build/NyrexVJ --fresh --no-update-check --no-welcome --netsync-selftest --bench-out "$RUNNER_TEMP/netsync.json"
          test -s "$RUNNER_TEMP/netsync.json"
          python3 scripts/test_netsync_two_instances.py build/NyrexVJ --output "$RUNNER_TEMP/netsync-two.json"
          test -s "$RUNNER_TEMP/netsync-two.json"
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-failover" build/NyrexVJ --fresh --no-update-check --no-welcome --failover-selftest --bench-out "$RUNNER_TEMP/failover.json"
          test -s "$RUNNER_TEMP/failover.json"
          python3 scripts/test_failover_two_instances.py build/NyrexVJ --output "$RUNNER_TEMP/failover-two.json"
          test -s "$RUNNER_TEMP/failover-two.json"
          python3 scripts/test_unreal_link.py build/NyrexVJ --output "$RUNNER_TEMP/unreal-link.json"
          test -s "$RUNNER_TEMP/unreal-link.json"
          build/NyrexVJ --scene-selftest tests/data/models
          if [ -n "${FFMPEG_SDK:-}" ]; then
            NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-video" build/NyrexVJ --fresh --no-update-check --no-welcome --video-selftest tests/data
          fi
          bash scripts/test_restart.sh build/NyrexVJ
          build/NyrexVJ --bench-nodes 5
          build/NyrexVJ --frames 30 --fresh --no-update-check --screenshot "$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"

      - name: Soak smoke tests through the release gate (software OpenGL only)
        run: |
          if [ -n "${FFMPEG_SDK:-}" ]; then
            export LD_LIBRARY_PATH="$PWD/build/ffmpeg"
          fi
          gates="$RUNNER_TEMP/gates"
          media="$RUNNER_TEMP/soak-media"
          mkdir -p "$gates" "$media"
          cp tests/data/models/morph_cube.glb tests/data/models/skin_arm.glb tests/data/test_alpha.png "$media/"
          if [ -n "${FFMPEG_SDK:-}" ]; then
            cp tests/data/test_h264.mp4 tests/data/test_hap.mov tests/data/test_odd_size.avi "$media/"
          fi
          {
            echo "## Soak smoke tests"
            echo
            echo "These runs use Mesa llvmpipe, a software renderer, on a virtual display. They show that the program starts, runs, changes clips and ends without a crash or an OpenGL error. They say nothing about a real graphics card, a projector, a driver or VRChat running next to it. Real hardware results are recorded by hand in tests/hardware/results.json."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-soak" build/NyrexVJ --fresh --no-update-check --no-welcome --soak 6 --bench-out "$gates/soak.json"
          soak_code=$?
          NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-soakmedia" build/NyrexVJ --fresh --no-update-check --no-welcome --soak 20 --soak-media "$media" --bench-out "$gates/soak-media.json"
          media_code=$?
          set -e
          test -s "$gates/soak.json"
          test -s "$gates/soak-media.json"
          failed=0
          python3 scripts/release_gate.py "$gates/soak.json" --profile smoke --exit-code "$soak_code" --json "$gates/gate-soak.json" --summary "$GITHUB_STEP_SUMMARY" || failed=1
          python3 scripts/release_gate.py "$gates/soak-media.json" --profile smoke --exit-code "$media_code" --json "$gates/gate-soak-media.json" --summary "$GITHUB_STEP_SUMMARY" || failed=1
          exit $failed

      - name: Keep the soak reports (software OpenGL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-software-gl
          path: ${{ runner.temp }}/gates
          if-no-files-found: ignore

      - name: Check the release state (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check_release.py --release

      - name: Check the dependencies of the program
        run: scripts/check_linux_deps.sh build/NyrexVJ 2.35

      - name: Package
        run: |
          mkdir -p dist pack/NyrexVJ-linux-x64
          strip -s build/NyrexVJ
          cp build/NyrexVJ dist/NyrexVJ-linux-x64
          chmod 755 dist/NyrexVJ-linux-x64
          cp build/NyrexVJ pack/NyrexVJ-linux-x64/NyrexVJ
          cp LICENSE README.md README.de.md CHANGELOG.md CHANGELOG.de.md THIRD_PARTY_LICENSES.md pack/NyrexVJ-linux-x64/
          cp docs/DEPENDENCIES.md pack/NyrexVJ-linux-x64/
          ldd build/NyrexVJ > pack/NyrexVJ-linux-x64/DEPENDENCIES-ldd.txt
          tar -C pack -czf dist/NyrexVJ-linux-x64.tar.gz NyrexVJ-linux-x64
          (cd dist && sha256sum NyrexVJ-linux-x64 > SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: NyrexVJ-linux-x64
          path: |
            dist/NyrexVJ-linux-x64
            dist/NyrexVJ-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux-scene-variants:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with Draco
            flags: -DNYREXVJ_DRACO=ON
          - name: without Meshopt and Draco
            flags: -DNYREXVJ_MESHOPT=OFF -DNYREXVJ_DRACO=OFF
    name: linux scene variant (${{ matrix.name }})
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb xauth libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNYREXVJ_VIDEO=OFF -DGLFW_BUILD_WAYLAND=OFF ${{ matrix.flags }}

      - name: Build the scene tests and the program
        run: cmake --build build --parallel --target nvj_scene3d_tests nvj_creator_tests NyrexVJ

      - name: Start the virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2

      - name: Test the 3D scene loader and render the test models
        run: |
          build/nvj_scene3d_tests
          build/nvj_creator_tests
          export NYREXVJ_DATA_DIR="$RUNNER_TEMP/nyrexvj-data"
          build/NyrexVJ --scene-selftest tests/data/models

  publish:
    needs: [windows, linux]
    if: ${{ always() && needs.windows.result == 'success' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the Linux build for a release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.linux.result != 'success' }}
        run: |
          echo "The Linux build did not succeed, the release is not published"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: NyrexVJ-windows-x64
          path: dist

      - uses: actions/download-artifact@v4
        if: ${{ needs.linux.result == 'success' }}
        with:
          name: NyrexVJ-linux-x64
          path: dist

      - name: Collect the release files
        run: |
          cd dist
          if [ -f SHA256SUMS-linux.txt ]; then
            cat SHA256SUMS.txt SHA256SUMS-linux.txt > SHA256SUMS.combined
            mv SHA256SUMS.combined SHA256SUMS.txt
            rm SHA256SUMS-linux.txt
          fi
          chmod 755 NyrexVJ-linux-x64 2>/dev/null || true
          ls -l
          cat SHA256SUMS.txt

      - name: Publish nightly
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          short="${GITHUB_SHA:0:7}"
          title="Nightly build ${{ github.run_number }} ($short)"
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          notes=$'Automatic build of the latest commit on main.\n\nCommit: '"$GITHUB_SHA"
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          awk -v v="$version" '
            /^## / {
              if (found) { exit }
              if (index($0, "## [" v "]") == 1 || index($0, "## " v) == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "NyrexVJ $version" > release_notes.md
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" dist/* --verify-tag --title "NyrexVJ $version" --notes-file release_notes.md
